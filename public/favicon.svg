<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dark circle background -->
  <circle cx="50" cy="50" r="48" fill="#0a0a0c" stroke="#d4af37" stroke-width="3" />
  
  <!-- Outer lens circle -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#2a2a35" stroke-width="2.5" />
  <circle cx="50" cy="50" r="30" fill="none" stroke="#d4af37" stroke-width="1.5" stroke-dasharray="8 4" />
  
  <!-- Camera lens focus crosshair/dot in center -->
  <circle cx="50" cy="50" r="8" fill="#d4af37" opacity="0.9" />
  <circle cx="50" cy="50" r="3" fill="#0a0a0c" />
  
  <!-- Shutter blades/lines -->
  <path d="M 50 12 L 50 20" stroke="#d4af37" stroke-width="2" />
  <path d="M 50 80 L 50 88" stroke="#d4af37" stroke-width="2" />
  <path d="M 12 50 L 20 50" stroke="#d4af37" stroke-width="2" />
  <path d="M 80 50 L 88 50" stroke="#d4af37" stroke-width="2" />
</svg>